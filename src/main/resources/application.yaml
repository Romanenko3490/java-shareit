spring:
  application.name: shareit
  main.banner-mode: off

  sql:
    init:
      mode: always

  jpa:
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC
    defer-datasource-initialization: true

  datasource:
    username: "dbuser"
    password: "12345"
    url: "jdbc:postgresql://localhost:15432/shereit"
    driver-class-name: org.postgresql.Driver
